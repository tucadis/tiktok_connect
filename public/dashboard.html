<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Event Router - Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1>
        <span class="status-indicator"></span>
        TikTok Live Event Router
      </h1>
      <nav>
        <a href="/dashboard" class="active">Dashboard</a>
        <a href="/stats">Statistics</a>
        <a href="/config">Configuration</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <h3>💬 Comments</h3>
        <div class="stat-value" id="stat-comments">0</div>
        <div class="stat-label">Total comments received</div>
      </div>

      <div class="stat-card">
        <h3>🎁 Gifts</h3>
        <div class="stat-value" id="stat-gifts">0</div>
        <div class="stat-label">Total gifts received</div>
      </div>

      <div class="stat-card">
        <h3>❤️ Likes</h3>
        <div class="stat-value" id="stat-likes">0</div>
        <div class="stat-label">Total likes</div>
      </div>

      <div class="stat-card">
        <h3>👤 Followers</h3>
        <div class="stat-value" id="stat-follows">0</div>
        <div class="stat-label">New followers</div>
      </div>

      <div class="stat-card">
        <h3>👁️ Viewers</h3>
        <div class="stat-value" id="stat-viewers">0</div>
        <div class="stat-label">Current viewers</div>
      </div>

      <div class="stat-card">
        <h3>💎 Revenue</h3>
        <div class="stat-value" id="stat-revenue">0</div>
        <div class="stat-label">Total diamonds</div>
      </div>
    </div>

    <div class="events-container">
      <h2>Live Events</h2>
      <div id="events-list">
        <p style="color: var(--text-secondary); text-align: center; padding: 40px;">
          Waiting for events...
        </p>
      </div>
    </div>
  </main>

  <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
